name: 기상 데이터 수집

# ⚠️ cron은 UTC 기준. KST = UTC + 9
#    아래 두 시각(매시 15분, 45분)은 분 단위라 UTC/KST가 동일하다.
#    GitHub Actions는 부하에 따라 5~30분 지연될 수 있어 하루 48회로 여유를 둔다.
#    중복은 스크립트가 제거하므로 여러 번 돌아도 무해하다.
on:
  schedule:
    - cron: "15 * * * *"
    - cron: "45 * * * *"
  workflow_dispatch:        # 수동 실행 버튼 (설정 직후 테스트용)

permissions:
  contents: write           # 수집 결과를 레포에 커밋하기 위해 필요

concurrency:
  group: collect            # 동시 실행 방지 (push 충돌 예방)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests pandas

      # 기상청 API 일시 장애로 한 회차가 실패해도 워크플로 전체를 멈추지 않는다.
      # 실황은 매시 15분·45분 두 번 시도하므로 다음 회차가 같은 시각을 복구한다.
      - name: 수집 실행
        id: collect
        continue-on-error: true
        timeout-minutes: 5
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: python scripts/collect.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M KST') 수집"
          # 다른 실행이 먼저 push했을 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "재시도 $i"
            sleep 5
          done
          exit 1
